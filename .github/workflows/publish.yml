name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Build package
        run: bun run build
        working-directory: packages/tailscale
      
      - name: Run tests
        run: bun test
        working-directory: packages/tailscale
      
      - name: Configure npm for GitHub Packages
        run: |
          echo "@ryanmoreau:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
      
      - name: Update version if manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd packages/tailscale
          # Update version in package.json directly to avoid npm workspace issues
          node -e "const p = require('./package.json'); p.version = '${{ github.event.inputs.version }}'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, '\t') + '\n');"
      
      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: packages/tailscale
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}